[pytest]
# ============================================================
# automation 新框架 pytest 配置
# ============================================================

# Python 路径：将 automation 父目录加入 sys.path，使 import automation.xxx 生效
pythonpath = ..

# 禁用 ID 转义
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

# 基础配置
minversion = 6.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 日志
log_cli = true
log_cli_level = INFO

# pytest 选项
addopts =
    -v
    -s
    --strict-markers
    --tb=short

# 自定义标记
markers =
    smoke: 冒烟测试 - 核心链路快速验证
    regression: 回归测试 - 完整功能覆盖
    permission: 权限测试 - 角色权限验证
    api: API接口测试
    ui: UI界面测试
